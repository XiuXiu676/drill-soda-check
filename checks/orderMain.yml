checks for orderMain:
  - row_count > 0:
      name: orderMain表不为空
  - failed rows:
      name: 标准库与中间库医嘱ID数一致
      fail query: |
        select 1 where (select count(1) from (select distinct orderId from orderMain where orderId is not null)) !=
        (select count(1) from (select distinct order_id from maicim_orderMain_icu))
  - failed rows:
      name: 标准库医嘱ID数小于等于镜像库医嘱ID数（中间库按住院流水号过滤了一部分）
      fail query: |
        select 1 where (select count(1) from (select distinct orderId from orderMain where orderId is not null)) >
        (select count(1) from (select distinct order_id from q_order101))
  - failed rows:
      name: orderId唯一
      fail query: |
        select 1
        where not exists (
        select orderId from orderMain
        where orderId is not null
        group by orderId
        having count(1) > 1)
  - failed rows:
      name: orderId不为空（排除只有groupNo和details的执行记录）
      fail query: |
        select * from orderMain
        where orderId is null
        and not (
        groupNo is not null
        and details is not null
        and orderId is null)
  - failed rows:
      name: 一个groupNo对应多个orderId（一对多验证）
      fail query: |
        select 1
        where not exists (
        select groupNo, count(distinct orderId) as order_count
        from orderMain
        where groupNo is not null
        and orderId is not null
        group by groupNo
        having count(distinct orderId) > 1)
  - failed rows:
      name: orderType不为空
      fail query: |
        select * from orderMain where orderId is not null and orderType is null
  - failed rows:
      name: orderType值域检查，0临时1长期
